<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage &amp; Parts Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#f4f7fc;font-family:Arial,Helvetica,sans-serif}
        .card{border:0;border-radius:14px}
        .management-layout{max-width:1200px}
    </style>
    <link rel="stylesheet" href="../css/background.css">
</head>
<body>
<main id="managementPage" class="container py-4 management-layout">
    <header class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h1 class="h2 mb-0">Garage &amp; Parts Management</h1>
        <div class="d-flex gap-2">
            <a href="../service-desk.html" class="btn btn-outline-primary">Service desk</a>
            <button class="btn btn-outline-secondary" type="button" onclick="logout()">Log out</button>
        </div>
    </header>
    <div id="managementError" class="alert alert-danger" role="alert" hidden></div>
    <div id="managementMessage" class="alert" role="status" hidden></div>

    <section class="card shadow p-4 mb-4">
        <h2 class="h4">Garages and available services</h2>
        <form id="garageForm" class="row g-3 mb-4">
            <input id="garageId" type="hidden">
            <div class="col-md-4"><label class="form-label" for="garageName">Garage name</label><input id="garageName" class="form-control" maxlength="120" required></div>
            <div class="col-md-5"><label class="form-label" for="garageAddress">Address</label><input id="garageAddress" class="form-control" maxlength="255" required></div>
            <div class="col-md-3"><label class="form-label" for="garagePhone">Phone</label><input id="garagePhone" class="form-control" maxlength="30"></div>
            <div class="col-md-6"><label class="form-label" for="garageServices">Available services (Ctrl/Cmd-click for multiple)</label>
                <select id="garageServices" class="form-select" multiple size="4">
                    <option>General Service</option><option>Oil Change</option><option>Brake Service</option><option>Battery Replacement</option>
                    <option>Engine Repair</option><option>AC Service</option><option>Wheel Alignment</option><option>Tyre Replacement</option>
                </select>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <div class="form-check mb-2"><input id="garageActive" class="form-check-input" type="checkbox" checked><label class="form-check-label" for="garageActive">Active</label></div>
            </div>
            <div class="col-md-4 d-flex align-items-end gap-2">
                <button class="btn btn-primary" type="submit">Save garage</button>
                <button class="btn btn-outline-secondary" type="button" onclick="resetGarageForm()">Clear</button>
            </div>
        </form>
        <div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Garage</th><th>Address</th><th>Phone</th><th>Services</th><th>Active</th><th></th></tr></thead><tbody id="garagesTable"></tbody></table></div>
    </section>

    <section class="card shadow p-4 mb-4">
        <h2 class="h4">Mechanics and available services</h2>
        <form id="mechanicForm" class="row g-3 mb-4">
            <input id="mechanicId" type="hidden">
            <div class="col-md-4"><label class="form-label" for="mechanicName">Mechanic name</label><input id="mechanicName" class="form-control" maxlength="120" required></div>
            <div class="col-md-4"><label class="form-label" for="mechanicEmail">Email</label><input id="mechanicEmail" type="email" class="form-control" maxlength="150"></div>
            <div class="col-md-4"><label class="form-label" for="mechanicPhone">Phone</label><input id="mechanicPhone" class="form-control" maxlength="30"></div>
            <div class="col-md-4"><label class="form-label" for="mechanicGarage">Garage</label><select id="mechanicGarage" class="form-select" required></select></div>
            <div class="col-md-4"><label class="form-label" for="mechanicServices">Services (Ctrl/Cmd-click for multiple)</label>
                <select id="mechanicServices" class="form-select" multiple size="4">
                    <option>General Service</option><option>Oil Change</option><option>Brake Service</option><option>Battery Replacement</option>
                    <option>Engine Repair</option><option>AC Service</option><option>Wheel Alignment</option><option>Tyre Replacement</option>
                </select>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <div class="form-check mb-2"><input id="mechanicActive" class="form-check-input" type="checkbox" checked><label class="form-check-label" for="mechanicActive">Active</label></div>
            </div>
            <div class="col-md-2 d-flex align-items-end gap-2">
                <button class="btn btn-primary" type="submit">Save mechanic</button>
                <button class="btn btn-outline-secondary" type="button" onclick="resetMechanicForm()">Clear</button>
            </div>
        </form>
        <div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Mechanic</th><th>Garage</th><th>Contact</th><th>Services</th><th>Active</th><th></th></tr></thead><tbody id="mechanicsTable"></tbody></table></div>
    </section>

    <section class="card shadow p-4 mb-4">
        <h2 class="h4">Spare-parts inventory</h2>
        <form id="inventoryForm" class="row g-3 mb-4">
            <input id="inventoryId" type="hidden">
            <div class="col-md-3"><label class="form-label" for="partSku">SKU</label><input id="partSku" class="form-control" maxlength="40" required></div>
            <div class="col-md-4"><label class="form-label" for="partName">Part name</label><input id="partName" class="form-control" maxlength="120" required></div>
            <div class="col-md-2"><label class="form-label" for="partQuantity">Stock</label><input id="partQuantity" class="form-control" type="number" min="0" required></div>
            <div class="col-md-2"><label class="form-label" for="partCost">Unit cost (₹)</label><input id="partCost" class="form-control" type="number" min="0" step="0.01" required></div>
            <div class="col-md-1 d-flex align-items-end"><button class="btn btn-primary" type="submit">Save</button></div>
            <div class="col-12"><button class="btn btn-sm btn-outline-secondary" type="button" onclick="resetInventoryForm()">Clear inventory form</button></div>
        </form>
        <div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>SKU</th><th>Part</th><th>Stock</th><th>Unit cost</th><th></th></tr></thead><tbody id="partsInventoryTable"></tbody></table></div>
    </section>
</main>
<script src="../js/script.js?v=garage-parts-1"></script>
</body>
</html>
